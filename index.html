<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css">

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-823QZR3KGF');

<body>
    <div class="main">
        <svg id="curves"></svg>
        <div class="cursor"></div>
